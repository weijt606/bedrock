name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: contract tests
        run: pytest -q
      - name: the app imports and the schema is generatable
        run: python -c "from app.main import app; app.openapi(); print('openapi ok')"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scoped to the commits this pull request introduces. History is not
      # scanned on purpose: a credential that leaked before this gate existed
      # is still back there, and scanning history would fail every build
      # forever while protecting nothing. Rotation is what fixes the past;
      # this gate is what protects the future.
      - name: resolve the range to scan
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: scan the incoming commits
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="${{ steps.range.outputs.range }}" \
            --redact \
            --no-banner \
            --verbose
